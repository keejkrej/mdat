[project]
name = "mdat"
version = "0.1.0"
description = "Python CLI package for standalone ND2/CZI microscopy data utilities."
readme = "../../README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "markdown-it-py<4",
  "mdat-smb-py[smbclient]",
  "nd2>=0.10",
  "pylibCZIrw>=4.1",
  "numpy>=1.26",
  "rich>=13.7",
  "tifffile>=2024.1",
  "typer>=0.12",
]

[tool.uv.sources]
mdat-smb-py = { git = "https://github.com/keejkrej/mdat-smb-py" }

[project.scripts]
mdat = "mdat.main:main"

[build-system]
requires = ["hatchling>=1.27", "pathspec<0.13"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mdat"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
